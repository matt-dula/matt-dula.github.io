[workspace]
authors = ["Matt Dula <dulamatt@msu.edu>"]
version = "0.1.0"
description = "Jekyll academic portfolio environment managed via Pixi"
channels = ["conda-forge"]
name = "matt-dula.github.io"

# Cross-platform support
platforms = [
    "linux-64",   # WSL2, Linux, GitHub Actions deployment
    "osx-arm64",  # Apple Silicon (M-series)
    "osx-64",     # Intel Macs
    "win-64",     # Native Windows
]

[tasks.serve]
cmd = "bundle exec jekyll serve"
depends-on = "clean"
description = "Start local development server with live reload"

[tasks.build]
cmd = "bundle exec jekyll build"
description = "Build static HTML/CSS site into _site/ directory"

[tasks.install]
cmd = "bundle install"
description = "Install Ruby gems listed in Gemfile"

[tasks.lock-linux]
cmd = "bundle lock --add-platform x86_64-linux"
description = "Add x86_64-linux platform target to Gemfile.lock for GitHub Actions"
[tasks.clean]
cmd = "rm -rf _site .jekyll-cache"
description = "Remove compiled site artifacts and temporary Jekyll cache"

[dependencies]
ruby = ">=4.0.6,<5"
compilers = ">=2.0.0,<3"
